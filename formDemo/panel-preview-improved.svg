<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f5f7fa" />
  
  <!-- 卡片容器 -->
  <rect x="50" y="50" width="800" height="600" rx="8" ry="8" fill="white" stroke="#ebeef5" stroke-width="1" />
  
  <!-- 卡片标题 -->
  <rect x="50" y="50" width="800" height="50" rx="8" ry="8" fill="#f5f7fa" />
  <text x="70" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#303133">参数配置</text>
  
  <!-- 根参数区域 -->
  <text x="70" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#303133">根参数</text>
  
  <!-- 根参数行 - 行内布局 -->
  <rect x="70" y="140" width="760" height="50" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  
  <!-- 参数类型 -->
  <text x="90" y="165" font-family="Arial" font-size="14" fill="#606266">类型</text>
  <rect x="130" y="150" width="150" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="140" y="170" font-family="Arial" font-size="14" fill="#409eff">object</text>
  <polygon points="270,165 280,155 280,175" fill="#c0c4cc" />
  
  <!-- 参数名称 -->
  <text x="300" y="165" font-family="Arial" font-size="14" fill="#606266">名称</text>
  <rect x="340" y="150" width="150" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="350" y="170" font-family="Arial" font-size="14" fill="#606266">userInfo</text>
  
  <!-- 添加子项按钮 - 行末 -->
  <rect x="700" y="150" width="100" height="30" rx="4" ry="4" fill="#409eff" />
  <text x="720" y="170" font-family="Arial" font-size="14" fill="white">添加子项</text>
  
  <!-- 树形结构的子参数列表 -->
  <text x="70" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#303133">子参数列表</text>
  
  <!-- 子参数1 - 行内布局 -->
  <rect x="90" y="230" width="740" height="100" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <rect x="90" y="230" width="3" height="100" fill="#409EFF" />
  
  <!-- 子参数1标题栏 -->
  <g>
    <!-- 展开/折叠图标 -->
    <polygon points="105,245 115,255 105,265" fill="#409EFF" transform="rotate(90, 110, 255)" />
    <text x="125" y="250" font-family="Arial" font-size="14" font-weight="bold" fill="#303133">name</text>
    <rect x="730" y="235" width="80" height="25" rx="4" ry="4" fill="#f56c6c" />
    <text x="750" y="250" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 子参数1的表单 - 行内布局 -->
  <text x="110" y="285" font-family="Arial" font-size="14" fill="#606266">类型</text>
  <rect x="150" y="270" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="160" y="290" font-family="Arial" font-size="14" fill="#606266">string</text>
  
  <text x="290" y="285" font-family="Arial" font-size="14" fill="#606266">名称</text>
  <rect x="330" y="270" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="340" y="290" font-family="Arial" font-size="14" fill="#606266">name</text>
  
  <text x="470" y="285" font-family="Arial" font-size="14" fill="#606266">值</text>
  <rect x="500" y="270" width="200" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="510" y="290" font-family="Arial" font-size="14" fill="#606266">张三</text>
  
  <!-- 子参数2 - 行内布局 -->
  <rect x="90" y="340" width="740" height="100" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <rect x="90" y="340" width="3" height="100" fill="#409EFF" />
  
  <!-- 子参数2标题栏 -->
  <g>
    <!-- 展开/折叠图标 -->
    <polygon points="105,355 115,365 105,375" fill="#409EFF" transform="rotate(90, 110, 365)" />
    <text x="125" y="360" font-family="Arial" font-size="14" font-weight="bold" fill="#303133">address</text>
    <rect x="730" y="345" width="80" height="25" rx="4" ry="4" fill="#f56c6c" />
    <text x="750" y="360" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 子参数2的表单 - 行内布局 -->
  <text x="110" y="395" font-family="Arial" font-size="14" fill="#606266">类型</text>
  <rect x="150" y="380" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="160" y="400" font-family="Arial" font-size="14" fill="#606266">object</text>
  
  <text x="290" y="395" font-family="Arial" font-size="14" fill="#606266">名称</text>
  <rect x="330" y="380" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="340" y="400" font-family="Arial" font-size="14" fill="#606266">address</text>
  
  <!-- 添加子项按钮 - 行末 -->
  <rect x="700" y="380" width="100" height="30" rx="4" ry="4" fill="#409eff" />
  <text x="720" y="400" font-family="Arial" font-size="14" fill="white">添加子项</text>
  
  <!-- 子参数2的嵌套子参数 - 行内布局 -->
  <rect x="130" y="450" width="700" height="100" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <line x1="110" y1="410" x2="130" y2="450" stroke="#dcdfe6" stroke-width="1" stroke-dasharray="3,3" />
  <rect x="130" y="450" width="3" height="100" fill="#67C23A" />
  
  <!-- 嵌套子参数标题栏 -->
  <g>
    <text x="145" y="470" font-family="Arial" font-size="14" font-weight="bold" fill="#303133">city</text>
    <rect x="700" y="455" width="80" height="25" rx="4" ry="4" fill="#f56c6c" />
    <text x="720" y="470" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 嵌套子参数的表单 - 行内布局 -->
  <text x="150" y="505" font-family="Arial" font-size="14" fill="#606266">类型</text>
  <rect x="190" y="490" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="200" y="510" font-family="Arial" font-size="14" fill="#606266">string</text>
  
  <text x="330" y="505" font-family="Arial" font-size="14" fill="#606266">名称</text>
  <rect x="370" y="490" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="380" y="510" font-family="Arial" font-size="14" fill="#606266">city</text>
  
  <text x="510" y="505" font-family="Arial" font-size="14" fill="#606266">值</text>
  <rect x="540" y="490" width="200" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="550" y="510" font-family="Arial" font-size="14" fill="#606266">北京</text>
  
  <!-- 对象值预览 -->
  <rect x="70" y="560" width="760" height="80" rx="4" ry="4" fill="#f8f8f8" stroke="#ebeef5" stroke-width="1" />
  <text x="90" y="580" font-family="Arial" font-size="14" font-weight="bold" fill="#303133">对象值预览：</text>
  <text x="90" y="605" font-family="Courier New" font-size="14" fill="#606266">{</text>
  <text x="110" y="625" font-family="Courier New" font-size="14" fill="#606266">"name": "张三",</text>
  <text x="110" y="645" font-family="Courier New" font-size="14" fill="#606266">"address": { "city": "北京" }</text>
  <text x="90" y="665" font-family="Courier New" font-size="14" fill="#606266">}</text>
</svg>