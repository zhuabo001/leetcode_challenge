<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f5f7fa" />
  
  <!-- 卡片容器 -->
  <rect x="50" y="50" width="800" height="600" rx="8" ry="8" fill="white" stroke="#ebeef5" stroke-width="1" />
  
  <!-- 卡片标题 -->
  <rect x="50" y="50" width="800" height="50" rx="8" ry="8" fill="#f5f7fa" />
  <text x="70" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#303133">参数配置</text>
  
  <!-- 统一的树形结构 - 根参数 -->
  <rect x="70" y="120" width="760" height="50" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  
  <!-- 根参数行 - 行内布局 -->
  <g>
    <!-- 参数类型 -->
    <text x="90" y="145" font-family="Arial" font-size="14" fill="#606266">类型</text>
    <rect x="130" y="130" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="140" y="150" font-family="Arial" font-size="14" fill="#409eff">object</text>
    <polygon points="240,145 250,135 250,155" fill="#c0c4cc" />
    
    <!-- 参数名称 -->
    <text x="280" y="145" font-family="Arial" font-size="14" fill="#606266">名称</text>
    <rect x="320" y="130" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="330" y="150" font-family="Arial" font-size="14" fill="#606266">userInfo</text>
    
    <!-- 添加子项按钮 - 行末 -->
    <rect x="700" y="130" width="100" height="30" rx="4" ry="4" fill="#409eff" />
    <text x="720" y="150" font-family="Arial" font-size="14" fill="white">添加子项</text>
  </g>
  
  <!-- 子参数1 - 直接连接到根参数 -->
  <rect x="90" y="190" width="740" height="50" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <!-- 连接线 -->
  <line x1="70" y1="170" x2="90" y2="190" stroke="#409EFF" stroke-width="1" />
  
  <!-- 子参数1行 - 行内布局 -->
  <g>
    <!-- 展开/折叠图标 -->
    <polygon points="105,215 115,205 105,195" fill="#409EFF" transform="rotate(90, 110, 205)" />
    
    <!-- 参数类型 -->
    <text x="130" y="215" font-family="Arial" font-size="14" fill="#606266">类型</text>
    <rect x="170" y="200" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="180" y="220" font-family="Arial" font-size="14" fill="#606266">string</text>
    
    <!-- 参数名称 -->
    <text x="280" y="215" font-family="Arial" font-size="14" fill="#606266">名称</text>
    <rect x="320" y="200" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="330" y="220" font-family="Arial" font-size="14" fill="#606266">name</text>
    
    <!-- 参数值 -->
    <text x="430" y="215" font-family="Arial" font-size="14" fill="#606266">值</text>
    <rect x="460" y="200" width="180" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="470" y="220" font-family="Arial" font-size="14" fill="#606266">张三</text>
    
    <!-- 删除按钮 -->
    <rect x="730" y="200" width="80" height="30" rx="4" ry="4" fill="#f56c6c" />
    <text x="750" y="220" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 子参数2 - 直接连接到根参数 -->
  <rect x="90" y="260" width="740" height="50" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <!-- 连接线 -->
  <line x1="70" y1="170" x2="90" y2="260" stroke="#409EFF" stroke-width="1" />
  
  <!-- 子参数2行 - 行内布局 -->
  <g>
    <!-- 展开/折叠图标 -->
    <polygon points="105,285 115,275 105,265" fill="#409EFF" transform="rotate(90, 110, 275)" />
    
    <!-- 参数类型 -->
    <text x="130" y="285" font-family="Arial" font-size="14" fill="#606266">类型</text>
    <rect x="170" y="270" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="180" y="290" font-family="Arial" font-size="14" fill="#606266">object</text>
    
    <!-- 参数名称 -->
    <text x="280" y="285" font-family="Arial" font-size="14" fill="#606266">名称</text>
    <rect x="320" y="270" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="330" y="290" font-family="Arial" font-size="14" fill="#606266">address</text>
    
    <!-- 添加子项按钮 - 行末 -->
    <rect x="650" y="270" width="100" height="30" rx="4" ry="4" fill="#409eff" />
    <text x="670" y="290" font-family="Arial" font-size="14" fill="white">添加子项</text>
    
    <!-- 删除按钮 -->
    <rect x="730" y="270" width="80" height="30" rx="4" ry="4" fill="#f56c6c" />
    <text x="750" y="290" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 子参数2的嵌套子参数 - 直接连接到子参数2 -->
  <rect x="110" y="330" width="720" height="50" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <!-- 连接线 -->
  <line x1="90" y1="310" x2="110" y2="330" stroke="#409EFF" stroke-width="1" />
  
  <!-- 嵌套子参数行 - 行内布局 -->
  <g>
    <!-- 参数类型 -->
    <text x="150" y="355" font-family="Arial" font-size="14" fill="#606266">类型</text>
    <rect x="190" y="340" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="200" y="360" font-family="Arial" font-size="14" fill="#606266">string</text>
    
    <!-- 参数名称 -->
    <text x="300" y="355" font-family="Arial" font-size="14" fill="#606266">名称</text>
    <rect x="340" y="340" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="350" y="360" font-family="Arial" font-size="14" fill="#606266">city</text>
    
    <!-- 参数值 -->
    <text x="450" y="355" font-family="Arial" font-size="14" fill="#606266">值</text>
    <rect x="480" y="340" width="160" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="490" y="360" font-family="Arial" font-size="14" fill="#606266">北京</text>
    
    <!-- 删除按钮 -->
    <rect x="730" y="340" width="80" height="30" rx="4" ry="4" fill="#f56c6c" />
    <text x="750" y="360" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 子参数2的第二个嵌套子参数 -->
  <rect x="110" y="400" width="720" height="50" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <!-- 连接线 -->
  <line x1="90" y1="310" x2="110" y2="400" stroke="#409EFF" stroke-width="1" />
  
  <!-- 第二个嵌套子参数行 - 行内布局 -->
  <g>
    <!-- 参数类型 -->
    <text x="150" y="425" font-family="Arial" font-size="14" fill="#606266">类型</text>
    <rect x="190" y="410" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="200" y="430" font-family="Arial" font-size="14" fill="#606266">string</text>
    
    <!-- 参数名称 -->
    <text x="300" y="425" font-family="Arial" font-size="14" fill="#606266">名称</text>
    <rect x="340" y="410" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="350" y="430" font-family="Arial" font-size="14" fill="#606266">street</text>
    
    <!-- 参数值 -->
    <text x="450" y="425" font-family="Arial" font-size="14" fill="#606266">值</text>
    <rect x="480" y="410" width="160" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="490" y="430" font-family="Arial" font-size="14" fill="#606266">朝阳路</text>
    
    <!-- 删除按钮 -->
    <rect x="730" y="410" width="80" height="30" rx="4" ry="4" fill="#f56c6c" />
    <text x="750" y="430" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 子参数3 - 直接连接到根参数 -->
  <rect x="90" y="470" width="740" height="50" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  <!-- 连接线 -->
  <line x1="70" y1="170" x2="90" y2="470" stroke="#409EFF" stroke-width="1" />
  
  <!-- 子参数3行 - 行内布局 -->
  <g>
    <!-- 展开/折叠图标 -->
    <polygon points="105,495 115,485 105,475" fill="#409EFF" transform="rotate(90, 110, 485)" />
    
    <!-- 参数类型 -->
    <text x="130" y="495" font-family="Arial" font-size="14" fill="#606266">类型</text>
    <rect x="170" y="480" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="180" y="500" font-family="Arial" font-size="14" fill="#606266">number</text>
    
    <!-- 参数名称 -->
    <text x="280" y="495" font-family="Arial" font-size="14" fill="#606266">名称</text>
    <rect x="320" y="480" width="100" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="330" y="500" font-family="Arial" font-size="14" fill="#606266">age</text>
    
    <!-- 参数值 -->
    <text x="430" y="495" font-family="Arial" font-size="14" fill="#606266">值</text>
    <rect x="460" y="480" width="180" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="470" y="500" font-family="Arial" font-size="14" fill="#606266">25</text>
    
    <!-- 删除按钮 -->
    <rect x="730" y="480" width="80" height="30" rx="4" ry="4" fill="#f56c6c" />
    <text x="750" y="500" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 对象值预览 -->
  <rect x="70" y="540" width="760" height="90" rx="4" ry="4" fill="#f8f8f8" stroke="#ebeef5" stroke-width="1" />
  <text x="90" y="560" font-family="Arial" font-size="14" font-weight="bold" fill="#303133">对象值预览：</text>
  <text x="90" y="580" font-family="Courier New" font-size="14" fill="#606266">{</text>
  <text x="100" y="600" font-family="Courier New" font-size="14" fill="#606266">"name": "张三",</text>
  <text x="100" y="620" font-family="Courier New" font-size="14" fill="#606266">"address": { "city": "北京", "street": "朝阳路" },</text>
  <text x="90" y="640" font-family="Courier New" font-size="14" fill="#606266">}</text>
</svg>