<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f5f7fa" />
  
  <!-- 卡片容器 -->
  <rect x="50" y="50" width="800" height="600" rx="8" ry="8" fill="white" stroke="#ebeef5" stroke-width="1" />
  
  <!-- 卡片标题 -->
  <rect x="50" y="50" width="800" height="50" rx="8" ry="8" fill="#f5f7fa" />
  <text x="70" y="80" font-family="Arial" font-size="16" font-weight="bold" fill="#303133">参数配置</text>
  
  <!-- 根参数区域 -->
  <rect x="70" y="120" width="760" height="80" rx="4" ry="4" fill="#f8f8f8" stroke="#ebeef5" stroke-width="1" />
  
  <!-- 根参数行 - 行内布局 -->
  <text x="90" y="145" font-family="Arial" font-size="14" fill="#606266">类型</text>
  <rect x="130" y="130" width="120" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="140" y="150" font-family="Arial" font-size="14" fill="#409eff">object</text>
  <polygon points="240,145 250,135 250,155" fill="#c0c4cc" />
  
  <text x="280" y="145" font-family="Arial" font-size="14" fill="#606266">名称</text>
  <rect x="320" y="130" width="150" height="30" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
  <text x="330" y="150" font-family="Arial" font-size="14" fill="#606266">userConfig</text>
  
  <!-- 添加子项按钮 - 行末 -->
  <rect x="700" y="130" width="100" height="30" rx="4" ry="4" fill="#409eff" />
  <text x="720" y="150" font-family="Arial" font-size="14" fill="white">添加子项</text>
  
  <!-- 树形结构容器 -->
  <rect x="70" y="220" width="760" height="280" rx="4" ry="4" fill="white" stroke="#ebeef5" stroke-width="1" />
  
  <!-- 树形结构标题 -->
  <text x="90" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#303133">参数树</text>
  
  <!-- 第一级参数 - name -->
  <g>
    <!-- 展开/折叠图标 -->
    <rect x="90" y="240" width="16" height="16" rx="2" ry="2" fill="#f5f7fa" stroke="#dcdfe6" stroke-width="1" />
    <line x1="93" y1="248" x2="103" y2="248" stroke="#606266" stroke-width="2" />
    
    <!-- 参数类型标签 -->
    <rect x="116" y="240" width="60" height="20" rx="10" ry="10" fill="#409EFF" />
    <text x="126" y="255" font-family="Arial" font-size="12" fill="white">string</text>
    
    <!-- 参数名称 -->
    <text x="186" y="255" font-family="Arial" font-size="14" fill="#303133">name</text>
    
    <!-- 参数值输入框 -->
    <rect x="240" y="240" width="200" height="24" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="250" y="255" font-family="Arial" font-size="14" fill="#606266">张三</text>
    
    <!-- 操作按钮 -->
    <rect x="650" y="240" width="60" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="665" y="255" font-family="Arial" font-size="12" fill="white">编辑</text>
    
    <rect x="720" y="240" width="60" height="24" rx="4" ry="4" fill="#F56C6C" />
    <text x="735" y="255" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 第一级参数 - age -->
  <g>
    <!-- 展开/折叠图标 -->
    <rect x="90" y="280" width="16" height="16" rx="2" ry="2" fill="#f5f7fa" stroke="#dcdfe6" stroke-width="1" />
    <line x1="93" y1="288" x2="103" y2="288" stroke="#606266" stroke-width="2" />
    
    <!-- 参数类型标签 -->
    <rect x="116" y="280" width="60" height="20" rx="10" ry="10" fill="#E6A23C" />
    <text x="126" y="295" font-family="Arial" font-size="12" fill="white">number</text>
    
    <!-- 参数名称 -->
    <text x="186" y="295" font-family="Arial" font-size="14" fill="#303133">age</text>
    
    <!-- 参数值输入框 -->
    <rect x="240" y="280" width="200" height="24" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="250" y="295" font-family="Arial" font-size="14" fill="#606266">25</text>
    
    <!-- 操作按钮 -->
    <rect x="650" y="280" width="60" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="665" y="295" font-family="Arial" font-size="12" fill="white">编辑</text>
    
    <rect x="720" y="280" width="60" height="24" rx="4" ry="4" fill="#F56C6C" />
    <text x="735" y="295" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 第一级参数 - address (object类型) -->
  <g>
    <!-- 展开/折叠图标 (展开状态) -->
    <rect x="90" y="320" width="16" height="16" rx="2" ry="2" fill="#f5f7fa" stroke="#dcdfe6" stroke-width="1" />
    <line x1="93" y1="328" x2="103" y2="328" stroke="#606266" stroke-width="2" />
    <line x1="98" y1="323" x2="98" y2="333" stroke="#606266" stroke-width="2" />
    
    <!-- 参数类型标签 -->
    <rect x="116" y="320" width="60" height="20" rx="10" ry="10" fill="#67C23A" />
    <text x="126" y="335" font-family="Arial" font-size="12" fill="white">object</text>
    
    <!-- 参数名称 -->
    <text x="186" y="335" font-family="Arial" font-size="14" fill="#303133">address</text>
    
    <!-- 添加子项按钮 -->
    <rect x="240" y="320" width="100" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="255" y="335" font-family="Arial" font-size="12" fill="white">添加子项</text>
    
    <!-- 操作按钮 -->
    <rect x="650" y="320" width="60" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="665" y="335" font-family="Arial" font-size="12" fill="white">编辑</text>
    
    <rect x="720" y="320" width="60" height="24" rx="4" ry="4" fill="#F56C6C" />
    <text x="735" y="335" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 连接线 -->
  <line x1="98" y1="336" x2="98" y2="360" stroke="#dcdfe6" stroke-width="1" />
  
  <!-- 第二级参数 - city (address的子参数) -->
  <g>
    <!-- 缩进和连接线 -->
    <line x1="98" y1="360" x2="120" y2="360" stroke="#dcdfe6" stroke-width="1" />
    
    <!-- 展开/折叠图标 -->
    <rect x="130" y="352" width="16" height="16" rx="2" ry="2" fill="#f5f7fa" stroke="#dcdfe6" stroke-width="1" />
    <line x1="133" y1="360" x2="143" y2="360" stroke="#606266" stroke-width="2" />
    
    <!-- 参数类型标签 -->
    <rect x="156" y="352" width="60" height="20" rx="10" ry="10" fill="#409EFF" />
    <text x="166" y="367" font-family="Arial" font-size="12" fill="white">string</text>
    
    <!-- 参数名称 -->
    <text x="226" y="367" font-family="Arial" font-size="14" fill="#303133">city</text>
    
    <!-- 参数值输入框 -->
    <rect x="280" y="352" width="200" height="24" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="290" y="367" font-family="Arial" font-size="14" fill="#606266">北京</text>
    
    <!-- 操作按钮 -->
    <rect x="650" y="352" width="60" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="665" y="367" font-family="Arial" font-size="12" fill="white">编辑</text>
    
    <rect x="720" y="352" width="60" height="24" rx="4" ry="4" fill="#F56C6C" />
    <text x="735" y="367" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 连接线 -->
  <line x1="98" y1="368" x2="98" y2="392" stroke="#dcdfe6" stroke-width="1" />
  
  <!-- 第二级参数 - street (address的子参数) -->
  <g>
    <!-- 缩进和连接线 -->
    <line x1="98" y1="392" x2="120" y2="392" stroke="#dcdfe6" stroke-width="1" />
    
    <!-- 展开/折叠图标 -->
    <rect x="130" y="384" width="16" height="16" rx="2" ry="2" fill="#f5f7fa" stroke="#dcdfe6" stroke-width="1" />
    <line x1="133" y1="392" x2="143" y2="392" stroke="#606266" stroke-width="2" />
    
    <!-- 参数类型标签 -->
    <rect x="156" y="384" width="60" height="20" rx="10" ry="10" fill="#409EFF" />
    <text x="166" y="399" font-family="Arial" font-size="12" fill="white">string</text>
    
    <!-- 参数名称 -->
    <text x="226" y="399" font-family="Arial" font-size="14" fill="#303133">street</text>
    
    <!-- 参数值输入框 -->
    <rect x="280" y="384" width="200" height="24" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="290" y="399" font-family="Arial" font-size="14" fill="#606266">朝阳路</text>
    
    <!-- 操作按钮 -->
    <rect x="650" y="384" width="60" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="665" y="399" font-family="Arial" font-size="12" fill="white">编辑</text>
    
    <rect x="720" y="384" width="60" height="24" rx="4" ry="4" fill="#F56C6C" />
    <text x="735" y="399" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 第一级参数 - settings (object类型，折叠状态) -->
  <g>
    <!-- 展开/折叠图标 (折叠状态) -->
    <rect x="90" y="424" width="16" height="16" rx="2" ry="2" fill="#f5f7fa" stroke="#dcdfe6" stroke-width="1" />
    <line x1="93" y1="432" x2="103" y2="432" stroke="#606266" stroke-width="2" />
    <line x1="98" y1="427" x2="98" y2="437" stroke="#606266" stroke-width="2" />
    
    <!-- 参数类型标签 -->
    <rect x="116" y="424" width="60" height="20" rx="10" ry="10" fill="#67C23A" />
    <text x="126" y="439" font-family="Arial" font-size="12" fill="white">object</text>
    
    <!-- 参数名称 -->
    <text x="186" y="439" font-family="Arial" font-size="14" fill="#303133">settings</text>
    
    <!-- 添加子项按钮 -->
    <rect x="240" y="424" width="100" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="255" y="439" font-family="Arial" font-size="12" fill="white">添加子项</text>
    
    <!-- 操作按钮 -->
    <rect x="650" y="424" width="60" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="665" y="439" font-family="Arial" font-size="12" fill="white">编辑</text>
    
    <rect x="720" y="424" width="60" height="24" rx="4" ry="4" fill="#F56C6C" />
    <text x="735" y="439" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 第一级参数 - isActive (boolean类型) -->
  <g>
    <!-- 展开/折叠图标 -->
    <rect x="90" y="464" width="16" height="16" rx="2" ry="2" fill="#f5f7fa" stroke="#dcdfe6" stroke-width="1" />
    <line x1="93" y1="472" x2="103" y2="472" stroke="#606266" stroke-width="2" />
    
    <!-- 参数类型标签 -->
    <rect x="116" y="464" width="60" height="20" rx="10" ry="10" fill="#909399" />
    <text x="126" y="479" font-family="Arial" font-size="12" fill="white">boolean</text>
    
    <!-- 参数名称 -->
    <text x="186" y="479" font-family="Arial" font-size="14" fill="#303133">isActive</text>
    
    <!-- 参数值输入框 -->
    <rect x="240" y="464" width="200" height="24" rx="4" ry="4" fill="white" stroke="#dcdfe6" stroke-width="1" />
    <text x="250" y="479" font-family="Arial" font-size="14" fill="#606266">true</text>
    
    <!-- 操作按钮 -->
    <rect x="650" y="464" width="60" height="24" rx="4" ry="4" fill="#409EFF" />
    <text x="665" y="479" font-family="Arial" font-size="12" fill="white">编辑</text>
    
    <rect x="720" y="464" width="60" height="24" rx="4" ry="4" fill="#F56C6C" />
    <text x="735" y="479" font-family="Arial" font-size="12" fill="white">删除</text>
  </g>
  
  <!-- 对象值预览 -->
  <rect x="70" y="520" width="760" height="120" rx="4" ry="4" fill="#f8f8f8" stroke="#ebeef5" stroke-width="1" />
  <text x="90" y="540" font-family="Arial" font-size="14" font-weight="bold" fill="#303133">对象值预览：</text>
  <text x="90" y="565" font-family="Courier New" font-size="14" fill="#606266">{</text>
  <text x="110" y="585" font-family="Courier New" font-size="14" fill="#606266">"name": "张三",</text>
  <text x="110" y="605" font-family="Courier New" font-size="14" fill="#606266">"age": 25,</text>
  <text x="110" y="625" font-family="Courier New" font-size="14" fill="#606266">"address": { "city": "北京", "street": "朝阳路" },</text>
  <text x="110" y="645" font-family="Courier New" font-size="14" fill="#606266">"settings": { },</text>
  <text x="110" y="665" font-family="Courier New" font-size="14" fill="#606266">"isActive": true</text>
  <text x="90" y="685" font-family="Courier New" font-size="14" fill="#606266">}</text>
</svg>